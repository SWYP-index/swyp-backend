name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/index:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/index:latest

      - name: Deploy on EC2 with Blue/Green
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ec2-user
            ACTIVE=$(cat active_version.txt || echo green)
            
            if [ "$ACTIVE" = "blue" ]; then NEW=green; OLD=blue; else NEW=blue; OLD=green; fi
            docker-compose up -d --no-deps --build spring-app-$NEW
            
            sleep 10
            
            if curl -sf http://localhost:$( [ "$NEW" = "blue" ] && echo 8080 || echo 8081 )/actuator/health; then
              sed -i "s/proxy_pass http:\/\/spring-app-.*:808[01]\//proxy_pass http:\/\/spring-app-$NEW:808$( [ "$NEW" = "blue" ] && echo 0 || echo 1 )\//g" ./nginx/conf.d/default.conf
              docker exec nginx nginx -s reload
              docker-compose stop spring-app-$OLD
              echo $NEW > active_version.txt
            else
              docker-compose stop spring-app-$NEW
              exit 1
            fi
            
            docker system prune -f
