name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/index:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/index:latest

      - name: Deploy on EC2 with Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ec2-user
            docker pull ${{ secrets.DOCKER_USERNAME }}/index:latest
            docker compose stop spring-app
            docker compose rm -f spring-app
            docker compose up -d spring-app
            docker system prune -f