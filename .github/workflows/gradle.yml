name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/index:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/index:latest

      - name: Deploy on EC2 with Blue/Green
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ec2-user

            docker pull ${{ secrets.DOCKER_USERNAME }}/index:latest
            echo "docker pull completed"
            
            NGINX_CONF="/home/ec2-user/nginx/conf.d/default.conf"
            echo "NGINX_CONF path: $NGINX_CONF"
            
            CURRENT_ACTIVE=$(grep -oP 'server spring-app-\K\w+' "$NGINX_CONF" | cut -d':' -f1)
            echo "CURRENT_ACTIVE: $CURRENT_ACTIVE"
            
            if [ "$CURRENT_ACTIVE" == "green" ]; then
              NEXT="blue"
              NEXT_PORT=8081
            else
              NEXT="green"
              NEXT_PORT=8082
            fi
            
            echo "NEXT: $NEXT"
            echo "NEXT_PORT: $NEXT_PORT"
                        
            docker compose up -d spring-app-$NEXT
            echo "docker compose up completed for spring-app-$NEXT"

            sleep 10
            
            check_health() {
              local url=$1
              local retries=5
              local wait=10
            
              for ((i=1; i<=retries; i++)); do
                status_code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
                echo "Checking health, attempt $i: status_code=$status_code"
                if [ "$status_code" == "200" ]; then
                  echo "Health check passed!"
                  return 0
                fi
                sleep $wait
              done
              echo "Health check failed after $retries attempts"
              return 1
            }
            
            HEALTH_URL="http://localhost:$NEXT_PORT/actuator/health"
            echo "Health check URL: $HEALTH_URL"
            
            if ! check_health "$HEALTH_URL"; then
              echo "Health check failed, stopping container spring-app-$NEXT"
              docker compose stop spring-app-$NEXT
              docker compose rm -f spring-app-$NEXT
              exit 1
            fi
            
            echo "Updating nginx config..."
            sed -i "s/server spring-app-.*/server spring-app-$NEXT:8080;/" $NGINX_CONF

            sleep 10
            
            echo "Reloading nginx..."
            docker exec nginx nginx -s reload

            sleep 10
            
            echo "Stopping old container spring-app-$CURRENT_ACTIVE"
            docker compose stop spring-app-$CURRENT_ACTIVE
            docker compose rm -f spring-app-$CURRENT_ACTIVE
            
            echo "Cleaning up docker system..."
            docker system prune -f
            
            echo "Deployment script completed successfully."
