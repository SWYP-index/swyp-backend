name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/index:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/index:latest

      - name: Deploy on EC2 with Blue/Green
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ec2-user
            
            NGINX_CONF="/etc/nginx/conf.d/default.conf"
            CURRENT_ACTIVE=$(grep -oP 'server spring-app-\K\w+' "$NGINX_CONF" | cut -d':' -f1)

            if [ "$CURRENT_ACTIVE" == "green" ]; then
              NEXT="blue"
              NEXT_PORT=8081
            else
              NEXT="green"
              NEXT_PORT=8082
            fi
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/index:latest
            docker compose up -d spring-app-$NEXT
            
            check_health() {
              local url=$1
              local retries=10
              local wait=5
            
              for ((i=1; i<=retries; i++)); do
                status_code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
                if [ "$status_code" == "200" ]; then
                  return 0
                fi
                sleep $wait
              done
              return 1
            }
            
            HEALTH_URL="http://localhost:$NEXT_PORT/health"
            
            if ! check_health "$HEALTH_URL"; then
              docker compose stop spring-app-$NEXT
              docker compose rm -f spring-app-$NEXT
              exit 1
            fi
            
            NGINX_CONF="/etc/nginx/conf.d/default.conf"
            sed -i "s/server spring-app-.*/server spring-app-$NEXT:8080;/" $NGINX_CONF
            
            docker exec nginx nginx -s reload
            
            docker compose stop spring-app-$CURRENT_ACTIVE
            docker compose rm -f spring-app-$CURRENT_ACTIVE
            
            docker system prune -f
