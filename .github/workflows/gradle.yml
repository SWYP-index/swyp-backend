name: Java CI with Gradle

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/index:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/index:latest

      - name: Deploy on EC2 with Blue/Green
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ec2-user
            
            STATUS_FILE="/home/ec2-user/deploy_status.txt"

            if [ ! -f "$STATUS_FILE" ]; then
              echo "blue" > "$STATUS_FILE"
            fi

            CURRENT=$(cat "$STATUS_FILE")
            echo "현재 활성 환경: $CURRENT"

            if [ "$CURRENT" == "blue" ]; then
              NEW="green"
            else
              NEW="blue"
            fi

            echo "새 환경으로 배포: $NEW"

            cd /home/ec2-user

            docker pull ${{ secrets.DOCKER_USERNAME }}/index:latest

            docker-compose up -d spring-app-$NEW

            sleep 10

            if ! curl -f http://localhost:$( [ "$NEW" == "blue" ] && echo "8080" || echo "8081" )/actuator/health; then
              echo "헬스체크 실패, 배포 중단"
              exit 1
            fi

            sed -i "s/proxy_pass http:\/\/spring-app-\(blue\|green\);/proxy_pass http:\/\/spring-app-$NEW;/" ./nginx/conf.d/default.conf

            docker exec nginx nginx -s reload

            docker-compose stop spring-app-$CURRENT

            echo "$NEW" > "$STATUS_FILE"

            docker system prune -f
